    <text x="0" y="44" font-size="36" font-weight="600" letter-spacing="-0.6" fill="#e6edf3">Shaswat Sharma</text>
    <text class="t0" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Zepto &#8212; $3.8bn base case against a $7.0bn private mark</text><text class="t1" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Sun Pharma / Organon &#8212; pass on the spread at 93.9% implied completion</text><text class="t2" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">PayPal &#8212; $60.50 below the floor of all three methods</text><text class="t3" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">ACC &#8212; a 20% profit miss moved the stock more than a 68% miss did</text><text class="t4" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Situational Awareness &#8212; put-linked exposure fell from 62% of gross to 0.03%</text><text class="t5" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Olist &#8212; 55% of won sellers never sold a single item</text><text class="t6" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Bank LCR &#8212; the lower ratio sits on the more retail-anchored funding base</text><text class="t7" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Campaign ROI &#8212; Display clears break-even at no level of spend</text><text class="t8" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Indirect Tax &#8212; 33.3% exceptions caught, matching the injected rate exactly</text><text class="t9" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Retail Media &#8212; one marketplace of three discloses the number that matters</text><text class="t10" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Private banks &#8212; every disclosed margin narrowed and all four grew profit anyway</text><text class="t11" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">EPC &#8212; two of four reported profit on negative operating cash flow</text><text class="t12" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Procure-to-pay audit &#8212; 2,175 possible duplicate payments in 251,734 items</text><text class="t13" x="2" y="76" font-size="14" fill="#8b98a5" opacity="0">Revenue assurance &#8212; discounts above policy are 93% of the leakage</text>
