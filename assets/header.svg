  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="0" y="44" font-size="36" font-weight="600" letter-spacing="-0.6" fill="#0f172a">Shaswat Sharma</text>
    <text class="t0" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Zepto &#8212; $3.8bn base case against a $7.0bn private mark</text><text class="t1" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Sun Pharma / Organon &#8212; pass on the spread at 93.9% implied completion</text><text class="t2" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">PayPal &#8212; $60.50 below the floor of all three methods</text><text class="t3" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">ACC &#8212; a 20% profit miss moved the stock more than a 68% miss did</text><text class="t4" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Situational Awareness &#8212; put-linked exposure fell from 62% of gross to 0.03%</text><text class="t5" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Olist &#8212; 55% of won sellers never sold a single item</text><text class="t6" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Bank LCR &#8212; the lower ratio sits on the more retail-anchored funding base</text><text class="t7" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Campaign ROI &#8212; Display clears break-even at no level of spend</text><text class="t8" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Indirect Tax &#8212; 33.3% exceptions caught, matching the injected rate exactly</text><text class="t9" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Retail Media &#8212; one marketplace of three discloses the number that matters</text><text class="t10" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Private banks &#8212; every disclosed margin narrowed and all four grew profit anyway</text><text class="t11" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">EPC &#8212; two of four reported profit on negative operating cash flow</text><text class="t12" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Indian AMCs &#8212; SIP inflows run ~8x FY17, yet only 9.5% of households invest</text><text class="t13" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Procure-to-pay audit &#8212; 2,175 possible duplicate payments in 251,734 items</text><text class="t14" x="2" y="76" font-size="14" fill="#5b6b7f" opacity="0">Revenue assurance &#8212; discounts above policy are 93% of the leakage</text>
    <rect x="0" y="98" width="1000" height="1" fill="#d7dee7"/>
    <rect x="0" y="118" width="1000" height="1" fill="#d7dee7"/>
    <text x="100.0" y="138" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">FINANCE</text><text x="300.0" y="138" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">VALUATION</text><rect x="200.0" y="122" width="1" height="22" fill="#dde3ea"/><text x="500.0" y="138" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">M&amp;A</text><rect x="400.0" y="122" width="1" height="22" fill="#dde3ea"/><text x="700.0" y="138" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">CAPITAL MARKETS</text><rect x="600.0" y="122" width="1" height="22" fill="#dde3ea"/><text x="900.0" y="138" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">STRATEGY</text><rect x="800.0" y="122" width="1" height="22" fill="#dde3ea"/><text x="100.0" y="168" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">OPERATIONS</text><rect x="0.0" y="148" width="200.0" height="1" fill="#dde3ea"/><text x="300.0" y="168" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">BUSINESS ANALYSIS</text><rect x="200.0" y="152" width="1" height="22" fill="#dde3ea"/><rect x="200.0" y="148" width="200.0" height="1" fill="#dde3ea"/><text x="500.0" y="168" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">RISK &amp; CONTROLS</text><rect x="400.0" y="152" width="1" height="22" fill="#dde3ea"/><rect x="400.0" y="148" width="200.0" height="1" fill="#dde3ea"/><text x="700.0" y="168" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">INTERNAL AUDIT</text><rect x="600.0" y="152" width="1" height="22" fill="#dde3ea"/><rect x="600.0" y="148" width="200.0" height="1" fill="#dde3ea"/><text x="900.0" y="168" font-size="11.5" letter-spacing="1.7" fill="#5b6b7f" text-anchor="middle">ECONOMICS</text><rect x="800.0" y="152" width="1" height="22" fill="#dde3ea"/><rect x="800.0" y="148" width="200.0" height="1" fill="#dde3ea"/>
