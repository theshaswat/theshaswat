name: activity graph

# Redraws the contribution graph as a snake animation once a day and on push.
# The palettes are this profile's own accent ramp rather than the action's
# default GitHub green, so the panel reads as part of the page instead of a
# widget dropped onto it.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%234b2e83&color_dots=%23eef1f5,%23ded7ec,%23c0b0dd,%238f74bd,%234b2e83
            dist/snake-dark.svg?color_snake=%23b39ddb&color_dots=%23161b22,%232b2440,%23443a63,%237663a8,%23b39ddb

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Redraw activity graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
